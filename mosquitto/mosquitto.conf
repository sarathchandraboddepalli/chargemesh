# Eclipse Mosquitto Configuration for ChargeMesh
# MQTT broker for OEM telemetry and real-time vehicle data

listener 1883
allow_anonymous true

# WebSocket listener for browser clients
listener 9001
protocol websockets
allow_anonymous true

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Persistence
persistence true
persistence_location /mosquitto/data/

# Message size limit (1MB for telemetry batches)
message_size_limit 1048576

# Max connections
max_connections 10000

# Keep-alive
keepalive_interval 60
