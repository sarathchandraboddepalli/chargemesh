version: "3.9"

services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - chargemesh

  ocpp_server:
    build: ./backend
    command: python -m app.ocpp.server
    ports:
      - "9000:9000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - chargemesh

  worker:
    build: ./backend
    command: celery -A app.worker worker --loglevel=info --concurrency=4 -Q telemetry,dispatch,settlements,notifications
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - chargemesh

  beat:
    build: ./backend
    command: celery -A app.worker beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - chargemesh

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file: .env.frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - chargemesh

  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: chargemesh
      POSTGRES_USER: chargemesh
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chargemesh"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chargemesh

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chargemesh

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - chargemesh

volumes:
  pgdata:
  mosquitto_data:
  mosquitto_log:

networks:
  chargemesh:
    driver: bridge
